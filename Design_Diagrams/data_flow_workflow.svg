<text x="25" y="772" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Replies: E2 → C6 → C5 → C4 over I10/I9/I8; C4 → C3 → C1 over I7/I4. C7 replies return to the requesting module.</text>
<text x="25" y="797" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Invalid graph → I4 field errors; denied access → I5 denial / I4 403; provider failure → normalized node error / stored failed run.</text>
<text x="25" y="822" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">This is the future execution flow. US2 currently requires placeholder CRUD; User_stories.md sets no numerical SLA.</text>
