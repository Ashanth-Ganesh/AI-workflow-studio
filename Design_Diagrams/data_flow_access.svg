<text x="25" y="772" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Stages may repeat a component. OAuth browser redirects are mediated by C1 through I1; provider exchanges belong to I2.</text>
<text x="25" y="797" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">I3 acknowledgments return to C2 before C2 issues I1 cookies. Session cookies are opaque; provider secrets stay server-side.</text>
<text x="25" y="822" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Existing authentication limits: OAuth attempt 10 minutes; application session 7 days. These are lifetimes, not response SLAs.</text>
